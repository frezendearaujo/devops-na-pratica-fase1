name: CodeQL

# Analise estatica de seguranca do codigo-fonte, o SAST da Aula 7. Roda junto
# com o pipeline e tambem uma vez por semana, para pegar regra nova publicada
# depois do ultimo commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analise SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

name: CI/CD

# Integracao continua em todo commit e pull request. A entrega continua roda
# somente em push na main: pull request nao publica imagem nem faz deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tasks-api

jobs:
  # ---------------------------------------------------------------- integracao
  lint:
    name: Analise estatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npx prettier --check .

      - name: Verificacao de tipos
        run: npx tsc --noEmit

      - name: ShellCheck nos scripts de deploy
        run: shellcheck scripts/*.sh

  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes unitarios e de integracao
        run: npm test

  security:
    name: Seguranca das dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de vulnerabilidades
        run: npm audit --audit-level=high

  terraform:
    name: Validacao da infraestrutura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Formatacao
        run: terraform fmt -check -recursive

      - name: Init (sem backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ------------------------------------------------------------------ artefato
  build:
    name: Build e publicacao da imagem
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Referencia imutavel da imagem
        id: reference
        run: echo "image=${IMAGE_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull request apenas constroi: publicar exigiria escrita no registry
          # a partir de codigo ainda nao revisado.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}

      - name: Varredura da imagem com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.reference.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ------------------------------------------------------------------- entrega
  deploy-staging:
    name: Deploy em staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Publicar a imagem no servico de staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: ./scripts/deploy.sh "${{ secrets.RENDER_SERVICE_ID_STAGING }}" "${{ needs.build.outputs.image }}"

      - name: Smoke test contra staging
        run: ./scripts/smoke-test.sh "${{ vars.STAGING_URL }}"

  deploy-production:
    name: Deploy em producao
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event_name == 'push'
    # O ambiente production exige revisor aprovado: o job fica pendente ate
    # alguem autorizar a promocao.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Publicar a imagem no servico de producao
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: ./scripts/deploy.sh "${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}" "${{ needs.build.outputs.image }}"

      - name: Smoke test contra producao
        run: ./scripts/smoke-test.sh "${{ vars.PRODUCTION_URL }}"

      - name: Registrar a versao publicada
        run: |
          {
            echo "### Versao em producao"
            echo
            echo "- imagem: \`${{ needs.build.outputs.image }}\`"
            echo "- commit: ${{ github.sha }}"
            echo "- url: ${{ vars.PRODUCTION_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
